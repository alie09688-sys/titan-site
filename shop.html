<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>TITAN — متجر الكفرات</title>
<link rel="stylesheet" href="style.css">
<style>
  .model.has-ph { border-color: #1f4aa8; cursor: pointer; }
  .model .tag.cam { color: #fff; background: var(--blue); border-radius: 999px; padding: 2px 8px; font-size: 11px; }
  .gal { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
  @media (min-width: 560px) { .gal { grid-template-columns: repeat(3, 1fr); } }
  .ph { display: block; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; color: var(--text); transition: border-color .15s, box-shadow .15s; }
  a.ph:hover, a.ph:active { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-glow); }
  .ph img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #0a0f18; }
  .ph .cap { padding: 10px 12px 12px; font-size: 13px; line-height: 1.6; }
  .ph .cap b { display: block; color: var(--blue-2); font-size: 12px; margin-top: 2px; }
  .ph .cap .code { color: var(--muted); font-size: 11px; direction: ltr; text-align: right; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="logo">
    <h1 class="wordmark">TITAN</h1>
    <div class="bar"></div>
    <p class="shopname" id="shopName"></p>
    <p class="tagline" id="shopTag"></p>
  </header>

  <div class="search">
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="اكتب نوع هاتفك... مثال: Hot 10 أو Smart 8">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </div>

  <main id="view"></main>

  <footer><b>TITAN</b> &nbsp;·&nbsp; <span id="footName"></span></footer>
</div>

<script src="config.js"></script>
<script src="cloud.js"></script>
<script>
window.startStore = function () {
  var D = window.TITAN_DATA || { shop: {}, brands: [] };
  var shop = D.shop || {};
  var view = document.getElementById('view');
  var q = document.getElementById('q');

  document.getElementById('shopName').textContent = shop.name || '';
  document.getElementById('shopTag').textContent = shop.tagline || '';
  document.getElementById('footName').textContent = shop.name || '';
  if (shop.name) document.title = 'TITAN — ' + shop.name;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // تبسيط النص للبحث: حروف صغيرة بدون مسافات أو شرطات
  function norm(s) { return String(s).toLowerCase().replace(/[\s\-_.]+/g, ''); }

  function brandCount(b) {
    return (b.series || []).reduce(function (n, s) { return n + (s.models || []).length; }, 0);
  }

  function waLink(brandName, model) {
    var num = String(shop.whatsapp || '').replace(/[^\d]/g, '');
    if (!num) return null;
    var txt = 'مرحبا، أريد كفر لهاتف ' + brandName + ' ' + model;
    return 'https://wa.me/' + num + '?text=' + encodeURIComponent(txt);
  }

  var counts = D.counts || {};
  function photoCount(brandId, m) { return counts[TitanCloud.mk(brandId, m)] || 0; }

  function modelHTML(brandName, m, showBrand, brandId) {
    var n = photoCount(brandId, m);
    if (n > 0) {
      return '<a class="model has-ph" href="#/m/' + encodeURIComponent(brandId) + '/' + encodeURIComponent(m) + '">' +
        '<span>' + esc(m) + '</span>' +
        (showBrand ? '<span class="brandtag">' + esc(brandName) + '</span>' : '') +
        '<span class="tag cam">📷 ' + n + '</span></a>';
    }
    var link = waLink(brandName, m);
    var inner = '<span>' + esc(m) + '</span>' +
      (showBrand ? '<span class="brandtag">' + esc(brandName) + '</span>' : (link ? '<span class="tag">اطلب ›</span>' : ''));
    return link
      ? '<a class="model" href="' + link + '" target="_blank" rel="noopener">' + inner + '</a>'
      : '<div class="model">' + inner + '</div>';
  }

  /* ---------- الصفحة الرئيسية ---------- */
  function home() {
    var h = '<div class="section-title">اختر نوع هاتفك</div><div class="brands">';
    D.brands.forEach(function (b) {
      var n = brandCount(b);
      h += '<button class="brand' + (n ? '' : ' empty') + '" data-id="' + esc(b.id) + '">' +
        '<span class="n">' + esc(b.name) + '</span>' +
        '<span class="c">' + (n ? n + ' موديل' : 'قريباً') + '</span></button>';
    });
    h += '</div>';
    if (shop.whatsapp) h += '<p class="hint">لم تجد هاتفك؟ راسلنا على واتساب وسنؤمّن لك الكفر.</p>';
    view.innerHTML = h;
  }

  /* ---------- صفحة ماركة ---------- */
  function brandPage(id, serieIdx) {
    var b = D.brands.filter(function (x) { return x.id === id; })[0];
    if (!b) { location.hash = ''; return; }
    var series = (b.series || []).filter(function (s) { return (s.models || []).length; });

    var h = '<div class="topbar"><button class="back" id="back" aria-label="رجوع">›</button>' +
      '<div><h2 class="page-title">' + esc(b.name) + '</h2><p class="page-sub">' + brandCount(b) + ' موديل متوفر</p></div></div>';

    if (!series.length) {
      h += '<div class="empty-state">لا توجد كفرات لهذه الماركة حالياً.<br>' +
        (shop.whatsapp ? 'راسلنا على واتساب وسنؤمّنها لك.' : 'اسأل البائع في المحل.') + '</div>';
      view.innerHTML = h; bindBack(); return;
    }

    var cur = serieIdx == null ? -1 : serieIdx; // -1 = الكل
    if (series.length > 1) {
      h += '<div class="chips"><button class="chip' + (cur === -1 ? ' on' : '') + '" data-s="-1">الكل</button>';
      series.forEach(function (s, i) { h += '<button class="chip' + (cur === i ? ' on' : '') + '" data-s="' + i + '">' + esc(s.name || 'أخرى') + '</button>'; });
      h += '</div>';
    }
    series.forEach(function (s, i) {
      if (cur !== -1 && cur !== i) return;
      h += (s.name ? '<div class="series-head"><span>' + esc(s.name) + '</span></div>' : '') + '<div class="models">';
      s.models.forEach(function (m) { h += modelHTML(b.name, m, false, b.id); });
      h += '</div>';
    });
    if (shop.whatsapp) h += '<p class="hint">الموديلات التي عليها 📷 فيها صور، اضغط عليها لترى الكفرات المتوفرة.</p>';

    view.innerHTML = h;
    bindBack();
    Array.prototype.forEach.call(view.querySelectorAll('.chip'), function (c) {
      c.onclick = function () { brandPage(id, parseInt(c.getAttribute('data-s'), 10)); window.scrollTo(0, 0); };
    });
  }

  function bindBack() {
    var b = document.getElementById('back');
    if (b) b.onclick = function () { location.hash = ''; };
  }

  /* ---------- نتائج البحث ---------- */
  function searchPage(text) {
    var t = norm(text);
    var res = [];
    D.brands.forEach(function (b) {
      (b.series || []).forEach(function (s) {
        (s.models || []).forEach(function (m) {
          // يطابق اسم الموديل أو الماركة + الموديل (مثال: infinix hot 9)
          if (norm(m).indexOf(t) !== -1 || norm(b.name + m).indexOf(t) !== -1 || norm(s.name + m).indexOf(t) !== -1) {
            res.push({ brand: b.name, model: m, id: b.id });
          }
        });
      });
    });
    var h = '<div class="section-title">نتائج البحث (' + res.length + ')</div>';
    if (!res.length) {
      h += '<div class="empty-state">لم نجد كفراً لهذا الموديل.<br>' +
        (shop.whatsapp ? 'راسلنا على واتساب وسنؤمّنه لك.' : 'اسأل البائع في المحل.') + '</div>';
    } else {
      h += '<div class="models">';
      res.forEach(function (r) { h += modelHTML(r.brand, r.model, true, r.id); });
      h += '</div>';
    }
    view.innerHTML = h;
  }

  /* ---------- معرض صور موديل ---------- */
  var IMG_OK = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;

  function photoLink(brandName, model, it) {
    var num = String(shop.whatsapp || '').replace(/[^\d]/g, '');
    if (!num) return null;
    var txt = 'مرحبا، أريد هذا الكفر:\n' + brandName + ' ' + model + '\nرمز الصورة: ' + (it.code || '') + (it.note ? '\n' + it.note : '');
    return 'https://wa.me/' + num + '?text=' + encodeURIComponent(txt);
  }

  function galleryPage(brandId, model) {
    var b = D.brands.filter(function (x) { return x.id === brandId; })[0];
    if (!b) { location.hash = ''; return; }
    var head = '<div class="topbar"><button class="back" id="gback" aria-label="رجوع">›</button>' +
      '<div><h2 class="page-title" style="direction:ltr;font-size:22px">' + esc(model) + '</h2><p class="page-sub">' + esc(b.name) + '</p></div></div>';
    view.innerHTML = head + '<div class="loading">جاري تحميل الصور...</div>';
    var back = function () { location.hash = '#/brand/' + encodeURIComponent(brandId); };
    document.getElementById('gback').onclick = back;
    var key = TitanCloud.mk(brandId, model);
    TitanCloud.itemsByModel(D.slug, key, 60).then(function (list) {
      if (location.hash.indexOf('#/m/') !== 0) return;
      list = list.filter(function (it) { return IMG_OK.test(it.img || ''); });
      list.sort(function (a, c) { return String(c.created || '').localeCompare(String(a.created || '')); });
      var h = head;
      if (!list.length) {
        var link = waLink(b.name, model);
        h += '<div class="empty-state">لا توجد صور متوفرة لهذا الموديل الآن.' + (link ? '<br><a class="btn" style="display:inline-block;margin-top:12px;padding:10px 18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700" href="' + link + '" target="_blank" rel="noopener">اطلبه عبر واتساب</a>' : '') + '</div>';
      } else {
        h += '<p class="hint" style="margin-top:14px">' + (shop.whatsapp ? 'اضغط على الكفر الذي يعجبك لإرسال طلبك عبر واتساب.' : 'اذكر رمز الصورة للبائع في المحل.') + '</p><div class="gal">';
        list.forEach(function (it) {
          var l = photoLink(b.name, model, it);
          var cap = '<div class="cap">' + (it.note ? esc(it.note) : '') + (shop.whatsapp ? '<b>اطلبه عبر واتساب ›</b>' : '') + '<div class="code">#' + esc(it.code || '') + '</div></div>';
          var img = '<img loading="lazy" alt="" src="' + esc(it.img) + '">';
          h += l ? '<a class="ph" href="' + l + '" target="_blank" rel="noopener">' + img + cap + '</a>' : '<div class="ph">' + img + cap + '</div>';
        });
        h += '</div>';
      }
      view.innerHTML = h;
      document.getElementById('gback').onclick = back;
    }).catch(function (e) {
      view.innerHTML = head + '<div class="empty-state">' + esc(e.message) + '</div>';
      document.getElementById('gback').onclick = back;
    });
  }

  /* ---------- التوجيه ---------- */
  function route() {
    var text = q.value.trim();
    if (text) { searchPage(text); return; }
    var g = location.hash.match(/^#\/m\/([^\/]+)\/(.+)$/);
    if (g) { galleryPage(decodeURIComponent(g[1]), decodeURIComponent(g[2])); return; }
    var m = location.hash.match(/^#\/brand\/(.+)$/);
    if (m) { brandPage(decodeURIComponent(m[1])); } else { home(); }
  }

  view.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.brand') : null;
    if (el) { location.hash = '#/brand/' + encodeURIComponent(el.getAttribute('data-id')); window.scrollTo(0, 0); }
  });
  q.addEventListener('input', route);
  window.addEventListener('hashchange', function () { q.value = ''; route(); window.scrollTo(0, 0); });
  route();
};
</script>

<script>
(function () {
  var view = document.getElementById('view');
  var slug = (new URLSearchParams(location.search).get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  var CK = 'titan_shop_cache_' + slug;

  function msg(t) { view.innerHTML = '<div class="empty-state">' + t + '</div>'; }
  function build(o) {
    var data = {}, counts = {};
    try { data = JSON.parse(o.data || '{}'); } catch (e) {}
    try { counts = JSON.parse(o.counts || '{}') || {}; } catch (e) {}
    return { slug: slug, shop: { name: o.name || '', tagline: o.tagline || '', whatsapp: o.whatsapp || '' }, brands: data.brands || [], counts: counts };
  }
  function apply(o) { window.TITAN_DATA = build(o); }

  if (!slug) { msg('رابط المتجر غير مكتمل.<br>امسح رمز QR الخاص بالمحل مرة أخرى.'); return; }
  if (!window.TitanCloud || !TitanCloud.configured()) { msg('المتجر غير جاهز بعد.'); return; }

  var started = false;
  // اعرض آخر نسخة محفوظة فوراً (مفيد مع الإنترنت البطيء)
  try { var c = localStorage.getItem(CK); if (c) { apply(JSON.parse(c)); started = true; startStore(); } } catch (e) {}
  if (!started) msg('جاري التحميل...');

  TitanCloud.getPublic('shops/' + slug).then(function (o) {
    try { localStorage.setItem(CK, JSON.stringify(o)); } catch (e) {}
    if (!started) { apply(o); started = true; startStore(); }
    else if (JSON.stringify(window.TITAN_DATA) !== JSON.stringify(build(o))) {
      location.reload(); // وصلت بيانات أحدث من الخادم
    }
  }).catch(function (e) {
    if (started) return;
    msg(e.code === 'NOT_FOUND' ? 'هذا المتجر غير موجود.<br>تأكد من الرابط أو من رمز QR.' : e.message);
  });
})();
</script>
</body>
</html>
